name: DonMir Boot Agent — CI Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Expansion and Build Platform
      run: |
        python -u main.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "DonMir-Architect"
        git config --global user.email "architect@donmir.io"
        git add .
        git commit -m "chore: autonomous expansion by DonMir Agent [skip ci]" || echo "No changes to commit"
        git push
